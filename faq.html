<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAQ - Fasqoo</title>
  <!-- Hier bleiben deine bestehenden Styles / Links erhalten -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- DAS AKTUALISIERTE MENÜ -->
<header>
  <div class="wrap nav">
    <div class="brand">
      <div class="brandmark">⌁</div>
      <div class="brandname">Fasqoo</div>
    </div>
    
    <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">☰</button>

    <nav class="main-menu" id="mainMenu" aria-label="Main navigation">
      <a href="index.html" id="navHome">Home</a>
      <a href="faq.html" id="navFaq" style="color: var(--orange);">FAQ</a>
      <a href="network-status.html" id="navStatus">Netzwerk-Status</a>
      <a href="subnet-calculator.html" id="navDiag">IT-Diagnose</a>
      <a href="about.html" id="navAbout">Über uns</a>
      <div class="menu-extra">
        <select id="lang" aria-label="Language">
          <option value="de">Deutsch</option>
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="it">Italiano</option>
          <option value="pt">Português</option>
          <option value="nl">Nederlands</option>
          <option value="tr">Türkçe</option>
          <option value="sq">Shqip</option>
          <option value="ar">العربية</option>
        </select>
        <button id="themeBtn" class="theme-btn" type="button" aria-label="Toggle dark mode" title="Dark mode">☾</button>
      </div>
    </nav>
  </div>
</header>

<!-- DEIN BESTEHENDER INHALT DER FAQ-SEITE -->
<main class="wrap">
  <h1>Häufig gestellte Fragen</h1>
  <p>Hier stehen deine bisherigen FAQ-Inhalte...</p>
</main>

<!-- DAS SKRIPT FÜR DIE MENÜ-STEUERUNG UND DEN DARK MODE -->
<script>
  const $ = id => document.getElementById(id);

  const menuToggle = $("menuToggle");
  const mainMenu = $("mainMenu");

  if(menuToggle && mainMenu){
    menuToggle.addEventListener("click", () => {
      mainMenu.classList.toggle("active");
    });
  }

  const themeBtn = $("themeBtn");
  if(themeBtn){
    themeBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      const dark = document.body.classList.contains("dark");
      localStorage.setItem("fasqoo_dark", dark);
      themeBtn.textContent = dark ? "☀" : "☾";
    });
  }

  if(localStorage.getItem("fasqoo_dark") === "true"){
    document.body.classList.add("dark");
    if(themeBtn) themeBtn.textContent = "☀";
  }
</script>

</body>
</html>
