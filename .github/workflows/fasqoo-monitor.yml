name: Fasqoo 24/7 Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fasqoo-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run monitor check
        id: monitor
        run: node scripts/monitor.js
        continue-on-error: true

      - name: Commit & push history
        if: always()
        run: |
          set -e
          git config user.name  "Fasqoo Monitor"
          git config user.email "monitor@fasqoo.com"
          git add history.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "check $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase --no-verify origin main && \
            git push --no-verify origin main && exit 0
            echo "Retry $i..."
            sleep 5
          done
          echo "Push failed after 5 retries"
          exit 1
