name: Fasqoo 24/7 Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fasqoo-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Run monitor check
        run: node scripts/monitor.js

      - name: Commit & push history
        run: |
          git config user.name  "Fasqoo Monitor"
          git config user.email "monitor@fasqoo.com"
          git add history.json
          git diff --staged --quiet || git commit -m "check $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for i in 1 2 3; do
            git pull --rebase --no-verify origin main && \
            git push --no-verify origin main && break
            echo "Retry $i..."
            sleep 3
          done
