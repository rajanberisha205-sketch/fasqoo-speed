<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Diagnostics & Subnet Calculator</title>
    <style>
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --border-color: #475569;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --success: #22c55e;
            --radius: 12px;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        [data-theme="light"] {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-input: #f1f5f9;
            --border-color: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #0284c7;
            --accent-hover: #0369a1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--accent);
        }

        /* Modernes Karten-Layout für alle Tools */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .card h2, .card h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        /* Formularelemente */
        .input-group, .form-group {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        input, select, button {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-input);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        button {
            background-color: var(--accent);
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        /* Tabellen für Ergebnisse */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        td, th {
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            text-align: left;
        }

        td:first-child {
            color: var(--text-muted);
            width: 45%;
        }

        /* Monospace für IP-Adressen und Werte */
        .code-val, code, pre {
            font-family: var(--font-mono);
            font-weight: 600;
            color: var(--accent);
        }

        /* Steuerungsleiste oben (Sprachauswahl & Theme) */
        .top-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        /* Responsives Design */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>IT Diagnostics & Subnet Calculator</h1>
            <div class="top-controls">
                <!-- Sprachauswahl (falls vorhanden, hier integriert) -->
                <select id="langSelect">
                    <option value="de">Deutsch</option>
                    <option value="en">English</option>
                </select>
                <button onclick="toggleTheme()" id="themeBtn">☀️ Light</button>
            </div>
        </header>

        <div class="dashboard-grid">
            <!-- 1. IPv4 Subnetzrechner -->
            <div class="card">
                <h2>IPv4 Subnet Calculator</h2>
                <div class="input-group">
                    <input type="text" id="ipv4Input" placeholder="192.168.1.10/24" style="flex: 1;">
                    <button onclick="calculateIPv4()">Berechnen</button>
                </div>
                <table>
                    <tr><td>Netzwerk:</td><td><span class="code-val" id="netAddr">-</span></td></tr>
                    <tr><td>Subnetzmaske:</td><td><span class="code-val" id="netMask">-</span></td></tr>
                    <tr><td>Erste IP:</td><td><span class="code-val" id="firstIp">-</span></td></tr>
                    <tr><td>Letzte IP:</td><td><span class="code-val" id="lastIp">-</span></td></tr>
                    <tr><td>Broadcast:</td><td><span class="code-val" id="broadcast">-</span></td></tr>
                    <tr><td>Hosts:</td><td><span class="code-val" id="totalHosts">-</span></td></tr>
                </table>
            </div>

            <!-- 2. DNS Lookup Tool -->
            <div class="card">
                <h2>Live DNS Lookup</h2>
                <div class="input-group">
                    <input type="text" id="dnsInput" placeholder="beispiel.de" style="flex: 1;">
                    <button onclick="runDnsLookup()">Abfragen</button>
                </div>
                <div id="dnsResults" style="margin-top: 1rem; font-size: 0.9rem; color: var(--text-muted);">
                    Ergebnisse erscheinen hier...
                </div>
            </div>

            <!-- 3. Netzwerk-Diagnose & Speed -->
            <div class="card">
                <h2>Netzwerk-Diagnose</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem;">Latenz, Speedtest und System-Infos messen.</p>
                <button onclick="runDiagnostics()" style="width: 100%; margin-bottom: 1rem;">Diagnose Starten</button>
                <div id="diagResults">
                    <table>
                        <tr><td>Latenz (Ping):</td><td><span class="code-val" id="pingResult">-</span></td></tr>
                        <tr><td>Geschwindigkeit:</td><td><span class="code-val" id="speedResult">-</span></td></tr>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Design-Funktion: Light/Dark Mode Umschalter
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            document.getElementById('themeBtn').innerText = newTheme === 'dark' ? '☀️ Light' : '🌙 Dark';
        }

        // Platzhalter für deine originalen Funktionen:
        function calculateIPv4() {

        }
        function runDnsLookup() {

        }
        function runDiagnostics() {

        }
    </script>
</body>
</html>
